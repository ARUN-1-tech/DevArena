version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devarena}
      POSTGRES_USER: ${POSTGRES_USER:-devarena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devarena_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devarena_user} -d ${POSTGRES_DB:-devarena}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devarena-network

  redis:
    image: redis:7-alpine
    container_name: devarena-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devarena-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devarena-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-devarena}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-devarena_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-devarena_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS:-5000}
      EXECUTION_SANDBOX_ENABLED: ${EXECUTION_SANDBOX_ENABLED:-true}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - devarena-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: devarena-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - devarena-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  devarena-network:
    driver: bridge
