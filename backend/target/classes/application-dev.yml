spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:devarena;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
